name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  unsupported-php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Unsupported PHP disables the extension without parsing its runtime
        run: docker run --rm --network none --mount type=bind,src="$PWD",dst=/work,readonly php:7.0.33-cli php /work/tests/unsupported_runtime.php
  php-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4.33', '8.2']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Runtime syntax and functional checks
        env:
          PHP_IMAGE: php:${{ matrix.php }}-cli
        run: docker run --rm --network none --mount type=bind,src="$PWD",dst=/work,readonly --entrypoint bash "$PHP_IMAGE" /work/scripts/check-compat.sh
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify runner PHP dependencies
        run: |
          php --version
          php -r 'foreach (["mbstring", "dom"] as $module) { if (!extension_loaded($module)) { fwrite(STDERR, "Required PHP extension missing: $module\n"); exit(1); } }'
      - name: Unit checks and release packaging
        run: ./scripts/check.sh
      - name: Apache and CRS integration
        run: |
          docker build -f tests/apache/Dockerfile -t ispconfig-modsecurity-test .
          docker run --rm ispconfig-modsecurity-test
      - name: Two-node ISPConfig lab
        run: |
          docker compose -f tests/setup/compose.yaml up -d --build --wait --wait-timeout 180
          docker compose -f tests/setup/compose.yaml exec -T server1 php /lab/panel_runtime.php
          docker compose -f tests/setup/compose.yaml exec -T server1 php /lab/smoke.php
          docker compose -f tests/setup/compose.yaml exec -T server1 php /lab/regex_settings.php
          docker compose -f tests/setup/compose.yaml exec -T server1 php /lab/server_settings.php
          docker compose -f tests/setup/compose.yaml exec -T server1 php /lab/stale_session.php
      - name: Online installer integration
        run: |
          docker compose -f tests/setup/compose.yaml cp scripts/install.sh server1:/tmp/modsecurity-install.sh
          docker compose -f tests/setup/compose.yaml cp dist server1:/tmp/modsecurity-release
          docker compose -f tests/setup/compose.yaml exec -T server1 bash /lab/install_online.sh /tmp/modsecurity-install.sh /tmp/modsecurity-release
      - name: Lab logs on failure
        if: failure()
        run: docker compose -f tests/setup/compose.yaml logs --tail=100
      - name: Stop lab
        if: always()
        run: docker compose -f tests/setup/compose.yaml down -v
