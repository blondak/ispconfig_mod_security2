name: Prepare release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build versioned package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package-release.sh "$RELEASE_TAG"
      - name: Create draft with release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" "dist/modsecurity-$version.tar.gz" "dist/modsecurity-$version.tar.gz.sha256" dist/install.sh dist/install.sh.sha256 dist/deploy-remote.sh dist/deploy-remote.sh.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" "dist/modsecurity-$version.tar.gz" "dist/modsecurity-$version.tar.gz.sha256" dist/install.sh dist/install.sh.sha256 dist/deploy-remote.sh dist/deploy-remote.sh.sha256 --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
